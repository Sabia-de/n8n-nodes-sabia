name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - name: Confirm tag matches package version
        run: test "$GITHUB_REF_NAME" = "$(node -p "require('./package.json').version")"
      - name: Publish with provenance
        run: npm publish --access public --provenance
      - name: Scan the published package
        run: npm run scan
