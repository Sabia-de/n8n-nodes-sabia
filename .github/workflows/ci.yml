name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Run lint
        run: 'npm run lint'

      - name: Run build
        run: 'npm run build'

      - name: Run contract and signature tests
        run: 'npm test'

  compatibility:
    strategy:
      fail-fast: false
      matrix:
        n8n-version: ['2.0.0', 'latest']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Test the packed node in an isolated n8n runtime
        env:
          TASK_N8N_VERSION: ${{ matrix.n8n-version }}
        run: |
          task_n8n_version="$(npm view "n8n@$TASK_N8N_VERSION" version)"
          task_workflow_version="$(npm view "n8n@$task_n8n_version" dependencies.n8n-workflow)"
          task_runtime="$(mktemp -d)"
          task_tarball="$(npm pack --silent --pack-destination "$RUNNER_TEMP")"
          npm install --prefix "$task_runtime" --no-audit --no-fund "n8n@$task_n8n_version" "n8n-workflow@$task_workflow_version" "$RUNNER_TEMP/$task_tarball"
          cp -R tests contract "$task_runtime/node_modules/n8n-nodes-sabia/"
          node -e 'const {createRequire}=require("node:module"); const {join}=require("node:path"); const root=process.argv[1]; const runtime=createRequire(join(root,"node_modules/n8n/package.json")); const node=createRequire(join(root,"node_modules/n8n-nodes-sabia/package.json")); if(runtime.resolve("n8n-workflow")!==node.resolve("n8n-workflow")) throw new Error("The package and n8n must use the same workflow runtime");' "$task_runtime"
          node --test "$task_runtime/node_modules/n8n-nodes-sabia/tests/"*.test.cjs
          "$task_runtime/node_modules/.bin/n8n" --version
