name: Node security

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.nvmrc'
      - '**/package.json'
      - 'scripts/check-node-version*.mjs'
      - '.github/workflows/node-security.yml'

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node --test scripts/check-node-version.test.mjs
      - run: node scripts/check-node-version.mjs
      - run: node scripts/check-node-version.mjs --security
